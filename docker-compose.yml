services:
  mongo:
    image: mongo:7
    container_name: handbag_mongo
    restart: unless-stopped

    volumes:
      - mongo-data:/data/db

    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: handbag_backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      MONGO_URI: mongodb://mongo:27017/handbag-store
      PORT: 5000
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}

    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: handbag_frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  mongo-data:
