version: '3.8'

services:
  # 1. MongoDB Service
  mongo:
    image: mongo:6.0
    container_name: handbag_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # 2. Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: handbag_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/handbag-store
      - PORT=5000
    depends_on:
      - mongo

  # 3. React Frontend (served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: handbag_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
